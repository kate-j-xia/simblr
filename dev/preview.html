<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>simblr theme preview</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;600;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..24,200..700,0..1,-25" rel="stylesheet">

    <link href="../css/tokens.css" rel="stylesheet">
    <link href="../css/base.css" rel="stylesheet">
    <link href="../css/layout.css" rel="stylesheet">
    <link href="../css/posts.css" rel="stylesheet">
    <link href="../css/dark.css" rel="stylesheet">
</head>
<body>
    <aside id="sidebar-left">
        <a href="/"><img class="avatar" src="https://placehold.co/128x128/eeeeee/999999.png" alt=""></a>
        <h1 class="title"><a href="/">kate j xia</a></h1>
        <div class="description">a sims 2 and 3 simblr. builds, legacies, and downloads.</div>
        <nav class="menu">
            <li><a href="#">home</a></li>
            <li><a href="#">ask</a></li>
            <li><a href="#">navigation</a></li>
            <li><a href="#">downloads</a></li>
        </nav>

        <section class="prefs">
            <button type="button" class="pref-toggle layout-toggle" aria-pressed="false" hidden>
                <span class="pref-label">grid view</span>
                <span class="material-symbols-outlined pref-icon">gallery_thumbnail</span>
            </button>
            <button type="button" class="pref-toggle theme-toggle" aria-pressed="false" hidden>
                <span class="pref-label">dark mode</span>
                <span class="material-symbols-outlined pref-icon">moon_stars</span>
            </button>
        </section>
    </aside>

    <section class="posts" data-page-kind="" data-tag="">
        <div class="grid__col-sizer"></div>
        <div class="grid__gutter-sizer"></div>
    </section>

    <footer class="pagination">
        <span class="page-steps">
            <a href="#">previous page</a>/<a href="#">next page</a>
        </span>
        <span class="page-nav">
            navigation
            <a class="current">1</a><a class="jump" href="#">2</a><a class="jump" href="#">3</a><a class="jump" href="#">4</a><a class="jump" href="#">5</a>
        </span>
    </footer>

    <script src="../js/vendor/masonry.pkgd.min.js"></script>
    <script src="../js/vendor/imagesloaded.pkgd.min.js"></script>
    <script src="fixtures.js"></script>
    <script src="../js/theme.js"></script>
</body>
</html>
